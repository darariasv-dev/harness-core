[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myproject"
version = "0.1.0"
description = "A headless-model pipeline project built on harness-core. Rename me."
requires-python = ">=3.9"
dependencies = ["harness-core", "httpx", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["myproject*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
